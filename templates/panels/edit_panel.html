{% extends "layouts/user_dashboard_base.html" %}

{% block title %}
Edit Solar Panel
{% endblock %}

{% block content %}

<div class="container-fluid">

    <!-- Header -->

    <div class="section-header mb-4">

        <div>

            <h3>

                <i class="bi bi-pencil-square text-success"></i>

                Edit Solar Panel

            </h3>

            <p>

                Update your solar panel information.

            </p>

        </div>

        <a href="{{ url_for('panel.my_panels') }}"
           class="btn btn-outline-light">

            <i class="bi bi-arrow-left"></i>

            Back to My Panels

        </a>

    </div>

    <div class="dashboard-card">

        <form method="POST">

            <div class="row">

                <!-- Panel Name -->

                <div class="col-md-6 mb-4">

                    <label class="form-label">

                        Panel Name

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="panel_name"
                        value="{{ panel.panel_name }}"
                        required>

                </div>

                <!-- Manufacturer -->

                <div class="col-md-6 mb-4">

                    <label class="form-label">

                        Manufacturer

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="manufacturer"
                        value="{{ panel.manufacturer }}"
                        required>

                </div>

                <!-- Model -->

                <div class="col-md-6 mb-4">

                    <label class="form-label">

                        Model Number

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="model_number"
                        value="{{ panel.model_number }}"
                        required>

                </div>

                <!-- Capacity -->

                <div class="col-md-6 mb-4">

                    <label class="form-label">

                        Capacity (kW)

                    </label>

                    <input
                        type="number"
                        step="0.01"
                        class="form-control"
                        name="capacity"
                        value="{{ panel.capacity }}"
                        required>

                </div>

                <!-- Installation Date -->

                <div class="col-md-6 mb-4">

                    <label class="form-label">

                        Installation Date

                    </label>

                    <input
                        type="date"
                        class="form-control"
                        name="installation_date"
                        value="{{ panel.installation_date }}"
                        required>

                </div>

                <!-- Serial -->

                <div class="col-md-6 mb-4">

                    <label class="form-label">

                        Serial Number

                    </label>

                    <input
                        type="text"
                        class="form-control"
                        name="serial_number"
                        value="{{ panel.serial_number }}"
                        required>

                </div>

                <!-- Location -->

                <div class="col-12 mb-4">

                    <label class="form-label">

                        Location

                    </label>

                    <textarea
                        class="form-control"
                        rows="4"
                        name="location"
                        required>{{ panel.location }}</textarea>

                </div>

            </div>

            <div class="d-flex gap-3">

                <button
                    type="submit"
                    class="btn btn-success">

                    <i class="bi bi-check-circle-fill"></i>

                    Update Panel

                </button>

                <a href="{{ url_for('panel.my_panels') }}"
                   class="btn btn-outline-light">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
