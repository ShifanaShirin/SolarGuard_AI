{% extends "layouts/user_dashboard_base.html" %}

{% block title %}
Register Solar Panel
{% endblock %}

{% block content %}

<div class="container-fluid">

    <div class="row justify-content-center">

        <div class="col-lg-10">

            <!-- Page Heading -->

            <div class="section-header mb-4">

                <div>

                    <h3>

                        <i class="bi bi-plus-circle-fill text-success"></i>

                        Register Solar Panel

                    </h3>

                    <p>

                        Add a new solar panel to your account.

                    </p>

                </div>

            </div>

            <!-- Error -->

            {% if error %}

            <div class="alert alert-danger">

                {{ error }}

            </div>

            {% endif %}

            <!-- Card -->

            <div class="dashboard-card">

                <form method="POST">

                    <div class="row">

                        <div class="col-md-6 mb-4">

                            <label class="form-label">

                                Panel Name

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="panel_name"
                                value="{{ form_data.panel_name if form_data else '' }}"
                                required>

                        </div>

                        <div class="col-md-6 mb-4">

                            <label class="form-label">

                                Manufacturer

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="manufacturer"
                                value="{{ form_data.manufacturer if form_data else '' }}"
                                required>

                        </div>

                        <div class="col-md-6 mb-4">

                            <label class="form-label">

                                Model Number

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="model_number"
                                value="{{ form_data.model_number if form_data else '' }}"
                                required>

                        </div>

                        <div class="col-md-6 mb-4">

                            <label class="form-label">

                                Capacity (kW)

                            </label>

                            <input
                                type="number"
                                step="0.01"
                                class="form-control"
                                name="capacity"
                                value="{{ form_data.capacity if form_data else '' }}"
                                required>

                        </div>

                        <div class="col-md-6 mb-4">

                            <label class="form-label">

                                Installation Date

                            </label>

                            <input
                                type="date"
                                class="form-control"
                                name="installation_date"
                                value="{{ form_data.installation_date if form_data else '' }}"
                                required>

                        </div>

                        <div class="col-md-6 mb-4">

                            <label class="form-label">

                                Serial Number

                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="serial_number"
                                value="{{ form_data.serial_number if form_data else '' }}"
                                required>

                        </div>

                        <div class="col-12 mb-4">

                            <label class="form-label">

                                Installation Location

                            </label>

                            <textarea
                                class="form-control"
                                rows="4"
                                name="location"
                                required>{{ form_data.location if form_data else '' }}</textarea>

                        </div>

                    </div>

                    <div class="d-flex gap-3">

                        <button
                            class="btn btn-success"
                            type="submit">

                            <i class="bi bi-check-circle-fill"></i>

                            Register Panel

                        </button>

                        <button
                            class="btn btn-outline-light"
                            type="reset">

                            Reset

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}
